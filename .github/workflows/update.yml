name: Atualizar Central 360

on:
  schedule:
    # A cada 6h (UTC): 00h, 06h, 12h, 18h
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-central-360
  cancel-in-progress: false

jobs:
  update:
    # Roda no PC do Mauricio (self-hosted): o INMET bloqueia IPs de datacenter
    # (confirmado tanto no sandbox da Anthropic quanto nos runners do GitHub),
    # mas funciona normalmente a partir de uma rede residencial/corporativa comum.
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit and push if changed
        run: |
          git config user.name "central-360-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "Sem mudanças em index.html; nada para commitar."
            exit 0
          fi
          git add index.html
          git commit -m "Atualização automática: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
