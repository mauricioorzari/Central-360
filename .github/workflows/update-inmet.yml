name: Atualizar Central 360 (INMET)

on:
  schedule:
    # A cada 6h (UTC), 5min depois do job da nuvem para reduzir conflito de push
    - cron: "5 0,6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-central-360
  cancel-in-progress: false

jobs:
  update:
    # Só o INMET. Precisa rodar neste PC (self-hosted): a proteção anti-bot
    # do site bloqueia por faixa de IP de datacenter (confirmado tanto no
    # sandbox da Anthropic quanto nos runners do GitHub Actions), mas
    # funciona normalmente a partir de uma rede residencial/corporativa comum.
    # Se este runner estiver offline, esse job só fica na fila e o GitHub
    # cancela sozinho depois de um tempo — não afeta o job da nuvem.
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Run scraper (INMET only)
        run: python scraper/scrape.py --sections inmet

      - name: Commit and push if changed
        run: |
          git config user.name "central-360-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          if git diff --quiet -- index.html; then
            echo "Sem mudanças em index.html; nada para commitar."
            exit 0
          fi
          git add index.html
          git commit -m "Atualização automática (INMET): $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
